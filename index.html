<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PeMA</title>
    <meta name="description" content="Short, private mindfulness and breathing sessions. Your history stays on your device." />
    <meta name="theme-color" content="#ff6b4a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PeMA" />
    <style>
      /* Splash shown until the app mounts and replaces #root's contents */
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: linear-gradient(150deg, #ff8a5c 0%, #ff6b4a 35%, #e8458b 70%, #7a2a6e 100%); color: #fff;
        font-family: Georgia, serif; font-size: 28px; font-style: italic; }
      #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); animation: splashBreath 3s ease-in-out infinite; }
      @keyframes splashBreath { 50% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="PeMA is loading">
        <img src="/icons/icon-192.png" alt="" />
        <span>PeMA</span>
      </div>
    </div>
    <noscript>PeMA needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating...</title>
</head>
<body style="background-color: #f8fafc; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; box-sizing: border-box;">
    <div style="background-color: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); max-width: 400px; width: 100%;">
      <!-- Simple Elegant Spinner -->
      <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px auto;"></div>
      <h2 style="font-size: 18px; font-weight: 600; color: #1e293b; margin: 0 0 10px 0;">Authenticating with Provider</h2>
      <p style="font-size: 13px; color: #64748b; margin: 0; line-height: 1.5;">Securing your connection. This window will close automatically.</p>
    </div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Extract parameters from URL hash fragment (standard Implicit Grant flow)
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    
    // Also support response parameters from URL query context
    const queryParams = new URLSearchParams(window.location.search);
    const error = params.get('error') || queryParams.get('error') || params.get('error_description') || queryParams.get('error_description');

    if (window.opener) {
      window.opener.postMessage({
        type: 'oauth-token',
        source: 'oauth-callback',
        token: accessToken,
        error: error
      }, window.location.origin);
    }
    
    // Auto-close safety trigger
    setTimeout(() => {
      window.close();
    }, 1500);
  </script>
</body>
</html>
